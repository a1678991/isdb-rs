[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["a1678991 <a1678991@iroserver.net>"]
repository = "https://github.com/a1678991/isdb-rs"

[workspace.dependencies]
arib-ts = { path = "crates/arib-ts" }
arib-text = { path = "crates/arib-text" }
arib-si = { path = "crates/arib-si" }
isdbt-core = { path = "crates/isdbt-core" }
isdbt-fec = { path = "crates/isdbt-fec" }
isdbt-ofdm = { path = "crates/isdbt-ofdm" }
thiserror = "2"
num-complex = "0.4"
rustfft = "6"
encoding_rs = "0.8"
proptest = "1"
isdbt-phy = { path = "crates/isdbt-phy" }
hackrf = { path = "crates/hackrf" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[profile.release]
debug = 1

[profile.test]
opt-level = 2

# The modulator must run faster than real time even in a dev build
# (`cargo run -p arib-cli -- tx --hackrf …`): unoptimised, the PHY crates
# reach only ≈ 0.2× real time and a HackRF underruns ≈ 75 % of its USB
# buffers. Optimise the signal-processing crates and all dependencies in
# the dev profile; debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.isdbt-fec]
opt-level = 3

[profile.dev.package.isdbt-ofdm]
opt-level = 3

[profile.dev.package.isdbt-phy]
opt-level = 3

[profile.dev.package.isdbt-core]
opt-level = 3
