[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
authors = ["a1678991 <a1678991@iroserver.net>"]
repository = "https://github.com/a1678991/isdb-rs"

[workspace.dependencies]
isdb-ts = { version = "0.1.0", path = "crates/isdb-ts" }
isdb-text = { version = "0.1.0", path = "crates/isdb-text" }
isdb-si = { version = "0.1.0", path = "crates/isdb-si" }
isdbt-core = { version = "0.1.0", path = "crates/isdbt-core" }
isdb-fec = { version = "0.1.0", path = "crates/isdb-fec" }
isdbt-fec = { version = "0.1.0", path = "crates/isdbt-fec" }
isdbs-core = { version = "0.1.0", path = "crates/isdbs-core" }
isdbs-phy = { version = "0.1.0", path = "crates/isdbs-phy" }
isdbs3-core = { version = "0.1.0", path = "crates/isdbs3-core" }
isdbs3-phy = { version = "0.1.0", path = "crates/isdbs3-phy" }
isdb-tlv = { version = "0.1.0", path = "crates/isdb-tlv" }
isdb-mmt = { version = "0.1.0", path = "crates/isdb-mmt" }
isdbt-ofdm = { version = "0.1.0", path = "crates/isdbt-ofdm" }
thiserror = "2"
num-complex = "0.4"
rustfft = "6"
encoding_rs = "0.8"
proptest = "1"
isdbt-phy = { version = "0.1.0", path = "crates/isdbt-phy" }
isdb-hackrf = { version = "0.1.0", path = "crates/isdb-hackrf" }
isdb-iio = { version = "0.1.0", path = "crates/isdb-iio" }
isdb-iq = { version = "0.1.0", path = "crates/isdb-iq" }
isdb-frontend = { version = "0.1.0", path = "crates/isdb-frontend" }
# Members choose the backends (`hackrf`, `pluto`) through their own features.
isdb-radio = { version = "0.1.0", path = "crates/isdb-radio", default-features = false }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ctrlc = "3"
# terminal mode for the playback keys of `isdb tx` (unix)
nix = { version = "0.31", default-features = false, features = ["term"] }

# Every member opts in with `[lints] workspace = true`. CI runs clippy with
# `-D warnings`, so "warn" fails CI while keeping local builds usable.
[workspace.lints.rust]
# `deny`, not `forbid`: the FFI crates `isdb-hackrf` and `isdb-iio` opt out
# with a crate-level `#![allow(unsafe_code)]`; `isdb-frontend` allows it on
# one item, `simd::run`, the call into its AVX2 / AVX-512 loops right after
# detecting their CPU features (an `unsafe` call by the language rules: a
# `#[target_feature]` function called from code without the feature);
# every other crate and item is unsafe-free.
unsafe_code = "deny"
missing_docs = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

# A subset of clippy::pedantic (plus a few restriction lints) that the code
# already satisfies. The pedantic group as a whole is not enabled: its
# cast_* / must_use_candidate / doc_markdown / missing_*_doc lints fire
# thousands of times on bit-field code and spec-citing docs.
[workspace.lints.clippy]
# pedantic
case_sensitive_file_extension_comparisons = "warn"
cast_ptr_alignment = "warn"
checked_conversions = "warn"
copy_iterator = "warn"
doc_link_with_quotes = "warn"
expl_impl_clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
implicit_hasher = "warn"
inconsistent_struct_constructor = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
large_types_passed_by_value = "warn"
manual_ilog2 = "warn"
manual_is_power_of_two = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_flatten = "warn"
match_bool = "warn"
maybe_infinite_iter = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
no_effect_underscore_binding = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
ptr_cast_constness = "warn"
range_minus_one = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
return_self_not_must_use = "warn"
should_panic_without_expect = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unnecessary_box_returns = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unused_async = "warn"
used_underscore_binding = "warn"
used_underscore_items = "warn"
# restriction
dbg_macro = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
rc_buffer = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = 1

[profile.test]
opt-level = 2

# The modulator must run faster than real time even in a dev build
# (`cargo run -p isdb-cli -- tx --radio hackrf …`): unoptimised, the PHY crates
# reach only ≈ 0.2× real time and an SDR underruns its buffers. Optimise
# the signal-processing crates and all dependencies in the dev profile;
# debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.isdb-fec]
opt-level = 3

[profile.dev.package.isdbt-fec]
opt-level = 3

[profile.dev.package.isdbt-ofdm]
opt-level = 3

[profile.dev.package.isdbt-phy]
opt-level = 3

[profile.dev.package.isdbt-core]
opt-level = 3
