[package]
name = "isdb-cli"
description = "isdb: ISDB-T streamer (TX/RX) and TS tools built on the spec crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://github.com/a1678991/isdb-rs/blob/main/crates/isdb-cli/README.md"
readme = "README.md"
keywords = ["isdb-t", "sdr", "hackrf", "mpeg-ts", "arib"]
categories = ["command-line-utilities", "multimedia::video", "hardware-support"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[[bin]]
name = "isdb"
path = "src/main.rs"

[dependencies]
isdbt-mux = { version = "0.1.0", path = "../isdbt-mux" }
isdb-analyze = { version = "0.1.0", path = "../isdb-analyze" }
isdbt-core.workspace = true
isdbt-fec.workspace = true
isdbt-ofdm.workspace = true
isdbt-phy.workspace = true
isdb-hackrf = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ctrlc = { workspace = true, features = ["termination"] }

[features]
default = ["hackrf"]
# HackRF TX/RX (`--hackrf`): links the system libhackrf through isdb-hackrf.
# Without it (`--no-default-features`) every file-based command still works
# and `--hackrf` fails with a message saying the feature is missing.
hackrf = ["dep:isdb-hackrf"]

[lints]
workspace = true
