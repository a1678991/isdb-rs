[package]
name = "isdb-cli"
description = "isdb: ISDB-T streamer (TX/RX) and TS tools built on the spec crates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://github.com/a1678991/isdb-rs/blob/main/crates/isdb-cli/README.md"
readme = "README.md"
keywords = ["isdb-t", "sdr", "hackrf", "pluto", "mpeg-ts"]
categories = ["command-line-utilities", "multimedia::video", "hardware-support"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[[bin]]
name = "isdb"
path = "src/main.rs"

[dependencies]
isdbt-mux = { version = "0.1.0", path = "../isdbt-mux" }
isdb-analyze = { version = "0.1.0", path = "../isdb-analyze" }
isdbt-core.workspace = true
isdbt-fec.workspace = true
isdbt-ofdm.workspace = true
isdbt-phy.workspace = true
isdb-radio.workspace = true
isdb-iq.workspace = true
isdb-frontend.workspace = true
isdbs-core.workspace = true
isdbs-phy.workspace = true
isdbs3-core.workspace = true
isdbs3-phy.workspace = true
isdb-tlv.workspace = true
isdb-mmt.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ctrlc = { workspace = true, features = ["termination"] }

[target.'cfg(unix)'.dependencies]
# Terminal mode for the playback keys of `isdb tx`.
nix.workspace = true

[dev-dependencies]
# In-memory sink and radio for the tx stream tests (no device, no libhackrf).
isdb-radio = { workspace = true, features = ["mock"] }

[features]
default = ["hackrf", "pluto"]
# The HackRF radio backend (`--radio hackrf`): links the system libhackrf
# through isdb-radio and isdb-hackrf. Without it (`--no-default-features`)
# every file-based command still works and `--radio` fails with a message
# naming the feature to enable.
hackrf = ["isdb-radio/hackrf"]
# The ADALM-Pluto family backend (`--radio pluto`, e.g. a PlutoSky R2 over
# Ethernet): links the system libiio 0.x through isdb-radio and isdb-iio.
pluto = ["isdb-radio/pluto"]

[lints]
workspace = true
