[package]
name = "isdbt-mux"
description = "ARIB ISDB-T service multiplexer: SI/PSI generation, MPEG-2 video/AAC packetisation, CBR OFDM-frame-paced output"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdbt-mux"
readme = "README.md"
keywords = ["multiplexer", "mpeg-ts", "arib", "isdb", "broadcast"]
categories = ["multimedia::video", "multimedia::encoding", "encoding"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdb-ts = { workspace = true, features = ["serde"] }
isdb-si.workspace = true
isdb-text.workspace = true
isdbt-core.workspace = true
isdbt-fec.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
# EUC-JP transcoding of BML sources authored in UTF-8 (`bml.source_encoding`)
encoding_rs.workspace = true

[dev-dependencies]
isdbt-phy.workspace = true
# relay tests validate the rebroadcast TS with the independent checker.
# Deliberately path-only (no version): isdb-analyze depends on isdbt-mux,
# so a versioned dev-dependency would be a publish cycle; `cargo package`
# drops version-less dev-dependencies from the published manifest.
isdb-analyze = { path = "../isdb-analyze" }

[lints]
workspace = true
