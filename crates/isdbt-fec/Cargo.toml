[package]
name = "isdbt-fec"
description = "ISDB-T bit-domain channel coding (ARIB STD-B31 §3.2-3.8): TS re-multiplex, RS(204,188), energy dispersal, byte interleave, convolutional code / Viterbi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdbt-fec"
readme = "README.md"
keywords = ["isdb-t", "reed-solomon", "viterbi", "fec", "arib"]
categories = ["algorithms", "encoding", "science"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdbt-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
