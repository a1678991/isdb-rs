[package]
name = "isdbt-phy"
description = "ISDB-T transmitter/receiver pipelines (ARIB STD-B31): TS packets <-> complex baseband"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdbt-phy"
readme = "README.md"
keywords = ["isdb-t", "modulator", "demodulator", "sdr", "dsp"]
categories = ["science", "multimedia::video"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdb-ts.workspace = true
isdbt-core.workspace = true
isdbt-fec.workspace = true
isdbt-ofdm.workspace = true
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
