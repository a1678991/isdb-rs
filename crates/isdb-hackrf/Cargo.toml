[package]
name = "isdb-hackrf"
# build.rs links the system libhackrf; only one crate in a graph may.
links = "hackrf"
description = "Minimal safe wrapper over libhackrf (system library) for ISDB-T TX/RX streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdb-hackrf"
readme = "README.md"
keywords = ["hackrf", "sdr", "radio", "ffi", "usb"]
categories = ["hardware-support", "api-bindings"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/build.rs", "/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# The workspace denies `unsafe_code`; this FFI wrapper lifts that for itself
# with `#![allow(unsafe_code)]` in src/lib.rs (as does isdb-iio).
[lints]
workspace = true
