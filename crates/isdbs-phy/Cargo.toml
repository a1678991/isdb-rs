[package]
name = "isdbs-phy"
description = "ISDB-S receive and transmit chains on the symbol side of the front end (ITU-R BO.1408-1, ARIB STD-B20 system): frame and superframe sync, burst- and TMCC-aided carrier recovery, TMCC and main-signal decoding to TS packets, and the transmitter from TS packets to superframe symbols"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdbs-phy"
readme = "README.md"
keywords = ["isdb-s", "satellite", "sdr", "tmcc", "arib"]
categories = ["science", "multimedia::encoding"]
include = ["/src/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdb-fec.workspace = true
isdb-frontend.workspace = true
isdbs-core.workspace = true
isdb-iq.workspace = true
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[lints]
workspace = true
