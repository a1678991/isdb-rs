[package]
name = "isdbt-ofdm"
description = "ISDB-T symbol-domain processing (ARIB STD-B31 §3.9-3.16): mapping, interleaving, OFDM frame, TMCC/AC, IFFT/GI, and receiver synchronisation/equalisation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdbt-ofdm"
readme = "README.md"
keywords = ["isdb-t", "ofdm", "dsp", "sdr", "arib"]
categories = ["science", "multimedia::video", "algorithms"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdbt-core.workspace = true
num-complex.workspace = true
rustfft.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
