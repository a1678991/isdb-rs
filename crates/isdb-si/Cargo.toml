[package]
name = "isdb-si"
description = "ARIB STD-B10 service information tables and descriptors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/isdb-si"
readme = "README.md"
keywords = ["arib", "isdb", "service-information", "epg", "broadcast"]
categories = ["multimedia::video", "parser-implementations", "encoding"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
isdb-ts.workspace = true
isdb-text.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
