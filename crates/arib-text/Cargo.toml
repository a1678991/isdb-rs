[package]
name = "arib-text"
description = "ARIB STD-B24 Vol.1 Part 2 Chapter 7 8-unit character coding (decode/encode)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/arib-text"
readme = "README.md"
keywords = ["arib", "isdb", "character-encoding", "japanese", "broadcast"]
categories = ["encoding", "text-processing"]
# Ship sources, examples and docs only: tests (and any local captures
# next to them) stay out of the .crate.
include = ["/src/**", "/examples/**", "/README.md", "/SPEC-NOTES.md", "/LICENSE", "/NOTICE"]

[dependencies]
encoding_rs.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
