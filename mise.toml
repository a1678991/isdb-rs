# Tool versions for the repository harness (hooks, CI linters, cargo-deny)
# and the task runner for every check. The Rust toolchain itself is pinned
# in rust-toolchain.toml (rustup); the Rust build/check tasks below are
# plain cargo/rustup underneath, so they need nothing beyond that toolchain
# plus cargo-deny for `deny` / `deny-offline` (`mise install`, or
# `cargo install --locked cargo-deny`). `mise tasks` lists every task.
#
#   mise run check   everything CI runs: lint, features, test, doc, deny,
#                    msrv, oracle (and `fpga:test` when fpga/ changes)
#   mise run lint    fmt-check + clippy (what the pre-commit hook runs, roughly)
#
# `depends` run in parallel (cargo serialises jobs that share a target
# directory); every task is self-contained, so the order does not matter.
[tools]
node = "24"
pnpm = "12.16.1"
lefthook = "2.2.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"  # used by actionlint for run: scripts
zizmor = "1.31.1"
cargo-deny = "0.20.2"
# every feature combination of the crates with features (`features-*`)
"github:taiki-e/cargo-hack" = "0.6.45"
# the FPGA simulation (`fpga:*`)
uv = "0.13.6"
# compiler cache for the CI jobs that build and link (.github/actions/sccache);
# optional locally (RUSTC_WRAPPER=sccache)
sccache = "0.19.0"

[settings]
minimum_release_age = "3d"

[hooks]
postinstall = ["pnpm install --frozen-lockfile", "lefthook install"]

[tasks."actions:lint"]
description = "lint GitHub Actions workflows (actionlint + zizmor) and verify actions.lock"
depends = ["actions:actionlint", "actions:zizmor", "actions:lock:verify"]

[tasks."actions:actionlint"]
description = "lint GitHub Actions workflow syntax with actionlint"
run = "actionlint"

[tasks."actions:zizmor"]
description = "run zizmor security linter on GitHub Actions workflows"
run = "zizmor --min-confidence medium .github"

# Action dependencies are locked in .github/workflows/actions.lock (GitHub
# Actions workflow lockfile, https://gh.io/actions-lockfile), written by the
# gh CLI extension github/gh-actions-lock: workflows keep tag refs, the
# lockfile records the commit each resolves to, and GitHub runs only that
# commit (the repository's "Require lockfile" policy blocks a workflow that
# is not locked). Not a mise tool: the extension's releases carry no
# checksums for mise.lock, so it is pinned by tag like GitHub's sample.
[tasks."actions:lock:install"]
description = "install (or re-pin) the gh-actions-lock extension"
run = "gh extension install github/gh-actions-lock --pin v0.4.0 --force"

[tasks."actions:lock"]
description = "update .github/workflows/actions.lock after changing a uses: (needs gh auth)"
run = "gh actions-lock --no-interactive"

[tasks."actions:lock:verify"]
description = "verify actions.lock: every uses: locked, every pin still resolves upstream (CI)"
run = "gh actions-lock --verify"

[tasks."actions:lock:verify-local"]
description = "offline: every uses: has an actions.lock entry (pre-commit; coverage only)"
run = "gh actions-lock --verify-local"

# --- Rust workspace -------------------------------------------------------

[tasks.check]
description = "everything CI runs (fpga:test only when fpga/ or its Rust models change)"
depends = ["lint", "features", "test", "doc", "deny", "msrv", "oracle"]

[tasks.lint]
description = "formatting check + clippy -D warnings"
depends = ["fmt-check", "clippy"]

[tasks.fmt]
description = "format all Rust sources (workspace + oracle helper)"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path oracle/rust_tx3/Cargo.toml",
]

[tasks.fmt-check]
description = "verify formatting"
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path oracle/rust_tx3/Cargo.toml --check",
]

[tasks.clippy]
description = "clippy on all targets, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "unit, integration and doc tests ([profile.test] is opt-level 2; #[ignore]d tests excluded)"
run = "cargo test --workspace --locked"

# Feature combinations (cargo-hack; `mise install` provides it). clippy
# builds and lints every combination of every crate's features (isdb-cli,
# isdb-radio and isdb-ts have any). The tests run each crate with features
# once without its default features and once per feature that is not a
# radio backend: isdb-cli and isdb-radio without hackrf and pluto (the build
# that links neither libhackrf nor libiio), isdb-radio's `mock`, isdb-ts's
# `serde`. `test` runs the default features, and a backend alone
# changes only what compiles, which clippy covers.
[tasks.features]
description = "clippy in every feature combination, tests without the defaults (cargo-hack)"
depends = ["features-clippy", "features-test"]

[tasks.features-clippy]
description = "clippy -D warnings, every feature combination of every crate (cargo-hack --feature-powerset)"
run = "cargo hack clippy --workspace --feature-powerset --all-targets --locked -- -D warnings"

[tasks.features-test]
description = "tests of isdb-cli, isdb-radio, isdb-ts without default features and per non-backend feature"
run = "cargo hack test -p isdb-cli -p isdb-radio -p isdb-ts --each-feature --skip default,hackrf,pluto --locked"

[tasks.test-release]
description = "the same tests in release (faster PHY loopbacks)"
run = "cargo test --workspace --locked --release"

[tasks.test-ignored]
description = "heavy #[ignore]d stress/throughput tests, release (not in CI)"
run = "cargo test --workspace --locked --release -- --ignored"

[tasks.doc]
description = "rustdoc with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --locked"

[tasks.deny]
description = "cargo-deny: advisories, bans, licenses, sources"
run = "cargo deny --locked check"

[tasks.deny-advisories]
description = "cargo-deny: the RustSec advisory database only (changes without a commit; not a required CI check)"
run = "cargo deny --locked check advisories"

[tasks.deny-offline]
description = "cargo-deny without the advisory database fetch (pre-commit)"
run = "cargo deny --locked check bans licenses sources"

# MSRV: single source of truth is `rust-version` in the workspace Cargo.toml.
[tasks.msrv]
description = "type-check every target with the MSRV toolchain (rustup toolchain install <rust-version>)"
run = '''
msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
test -n "$msrv"
cargo "+$msrv" check --workspace --all-targets --locked --target-dir target/msrv
'''

[tasks.oracle]
description = "build-check and clippy the stand-alone oracle/rust_tx3 helper"
run = "cargo clippy --manifest-path oracle/rust_tx3/Cargo.toml --target-dir target/oracle --all-targets --locked -- -D warnings"

# --- FPGA (fpga/: Amaranth HDL, built outside cargo; needs uv) ------------
# uv tasks resolve against PyPI, which fpga/uv.lock records, unless
# UV_DEFAULT_INDEX is set (a user-level default index would otherwise make
# `uv run --locked` ask for a relock); fpga/tezuka/*.sh do the same.
# UV_EXCLUDE_NEWER: fpga/uv.lock was resolved with a 7-day release cooldown
# (exclude-newer-span = "P7D"), which uv then requires of every `--locked`
# run; set here so CI and machines without that uv.toml setting match.

[tasks."fpga:vectors"]
description = "write the FPGA test vectors from the Rust models (receive front end, transmit interpolator, LDPC decoder, the ISDB-S3 chain after the front end) into fpga/build"
run = [
  "mkdir -p fpga/build",
  "cargo run -q --release --locked -p isdb-frontend --example vectors -- fpga/build/vec-1-s-t16.json - s 16 3000 5 8",
  "cargo run -q --release --locked -p isdb-frontend --example vectors -- fpga/build/vec-2-s3-t32.json - s3 32 3000 6 8",
  "cargo run -q --release --locked -p isdb-frontend --example vectors -- fpga/build/vec-3-s3-t32-trim.json - s3 32 3000 6 8 -0.17",
  "cargo run -q --release --locked -p isdb-frontend --example vectors -- fpga/build/vec-4-s-t32-trim.json - s 32 3000 6 8 -0.075",
  "cargo run -q --release --locked -p isdb-frontend --example txvectors -- fpga/build",
  "cargo run -q --release --locked -p isdbs-phy --example txvectors -- fpga/build/tx-5-isdbs.json",
  # the LDPC decoder's sets and the address tables (ldpc-*.json); with
  # ISDB_RS_ISDBS3_TLV_IQ set, also the two from its first recording
  "cargo run -q --release --locked -p isdbs3-phy --example ldpcvectors -- fpga/build",
  # the chain's stage and whole-chain sets (chain-*.json)
  "cargo run -q --release --locked -p isdbs3-phy --example chainvectors -- fpga/build",
]

[tasks."fpga:tx-vectors"]
description = "write the transmit block's second vector sets, from its Python model (fpga/isdb_fpga/txmodel.py), into fpga/build"
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = [
  "uv run --locked python -m isdb_fpga.txmodel build/txvec-py-1-isdbs.json --preset isdbs",
  "uv run --locked python -m isdb_fpga.txmodel build/txvec-py-2-stress.json --preset stress",
]

[tasks."fpga:ldpc-vectors"]
description = "write the LDPC decoder's Python-model vector sets (fpga/isdb_fpga/ldpcmodel.py: toy codes, 93/120 and TMCC at step 17) into fpga/build"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python -m isdb_fpga.ldpcmodel --all build"

[tasks."fpga:ldpc-estimate"]
description = "Yosys synth_xilinx resource estimate of the LDPC decoder (S = 17, 34) and its cycles per iteration"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = [
  "uv run --locked python synth/ldpc_estimate.py 17 34",
  "uv run --locked python synth/ldpc_cycles.py 17 34",
]

[tasks."fpga:test"]
description = "simulate the FPGA front end, transmit block and LDPC decoder against their models, bit for bit"
depends = ["fpga:vectors", "fpga:tx-vectors", "fpga:ldpc-vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python -m unittest discover -s tests -v"

[tasks."fpga:verilog"]
description = "Verilog of the 32-tap front end block for a vendor flow (fpga/build/isdb_symbols_rx.v)"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python synth/verilog.py build/vec-2-s3-t32.json 32 build/isdb_symbols_rx.v"

[tasks."fpga:tx-verilog"]
description = "Verilog of the transmit block, the Rust model's default bank (ISDB-S, 40 Msps, 10 dB) as BRAM init (fpga/build/isdb_symbols_tx.v)"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python synth/verilog.py build/tx-1-continuous.json build/isdb_symbols_tx.v"

[tasks."fpga:tx-estimate"]
description = "Yosys synth_xilinx resource estimate of the transmit block"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python synth/estimate.py build/tx-1-continuous.json"

[tasks."fpga:estimate"]
description = "Yosys synth_xilinx resource estimate of the 32-tap front end"
depends = ["fpga:vectors"]
dir = "fpga"
env = { UV_DEFAULT_INDEX = "{{ get_env(name='UV_DEFAULT_INDEX', default='https://pypi.org/simple') }}", UV_EXCLUDE_NEWER = "7 days" }
run = "uv run --locked python synth/estimate.py build/vec-2-s3-t32.json 32"
